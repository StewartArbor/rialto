title: Treemeliority Market
description: Field tools, optics, growing equipment, environmental instruments, and references for people interested in trees, animals, and ecosystems.
url: https://market.treemeliority.org
baseurl: ""
lang: en
markdown: kramdown
permalink: pretty
timezone: Asia/Almaty

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - _site
  - en
  - ru
  - kz
  - _data
  - _includes
  - assets
