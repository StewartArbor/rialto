<!-- BOTTOM BAR -->

<div class="bottom-bar">

  <button id="openFilters" class="bottom-btn">
    🔍 Filter
  </button>

  <button id="randomPick" class="bottom-btn primary">
    🎯 Pick for me
  </button>

</div>


<!-- FILTER DRAWER -->

<div class="filter-drawer" id="filterDrawer">

  <div class="filter-panel">

    <div class="filter-header">
      <h3>Filter</h3>
      <button id="closeFilter">✕</button>
    </div>

    <div class="filter-section">

      <button data-cat="all">All</button>
      <button data-cat="chargers">Chargers</button>
      <button data-cat="powerbanks">Power Banks</button>


    </div>

  </div>

</div>
